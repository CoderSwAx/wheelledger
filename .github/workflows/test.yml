name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - python: '3.9'
            runner: ubuntu-22.04
          - python: '3.14'
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: wheelledger --help
      - name: Build two example releases
        run: |
          python - <<'PY'
          from examples.demo import make_wheel
          from pathlib import Path
          make_wheel(Path.cwd(), "1", {"locale/sk.json": "{}"})
          make_wheel(Path.cwd(), "2", {})
          PY
      - uses: ./
        with:
          before: pocketclock-1-py3-none-any.whl
          after: pocketclock-2-py3-none-any.whl
